[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comrad-bench"
version = "1.0.0"
description = "MARL benchmark suite in ViZDoom"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Khoi H.B. Nguyen", email = "baokhoi136@gmail.com"},
    {name = "Tristan Tomilin", email = "tristan.tomilin@hotmail.com"},
    {name = "Dimitar Zhekov", email = "mitko.zh@gmail.com"},
]
keywords = ["marl", "vizdoom", "reinforcement-learning", "multi-agent", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: First Person Shooters",
]
dependencies = [
    "numpy>=1.26.4,<2.0",
    "gymnasium[classic-control]>=0.27,<1.0",
    "pettingzoo<1.25.0",
    "opencv-python>=4.11.0",
    "pygame>=2.6.1",
    "pre-commit>=4.5.1",
    "pynput>=1.8.1",
    "wandb[media]==0.22.1",
    "torch>=2.10.0",
    "torchrl>=0.11.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "psutil>=7.2.2",
    "pyglet>=2.1.12",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "threadpoolctl>=3.6.0",
    "colorlog>=6.10.1",
    "signal-slot-mp>=1.0.3,<2.0",
    "filelock>=3.20.3",
    "huggingface-hub>=0.10.0",
    "pandas>=2.3.3",
    "onnx>=1.19.0",
    "onnxruntime>=1.23.2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "scipy>=1.17.0",
    "vizdoom>=1.3.0",
    "ml-dtypes>=0.4.0,<0.5",
]

[project.urls]
Homepage = "https://github.com/TTomilin/COMRAD"
Repository = "https://github.com/TTomilin/COMRAD"

[project.optional-dependencies]
sample-factory = [
    "torch>=2.9.0",
    "wandb>=0.22.1",
    "tensorboard>=2.20.0",
    "colorlog>=6.10.1",
    "signal-slot-mp>=1.0.5",
    "faster-fifo>=1.5.2",
    "filelock>=3.19.1",
    "psutil>=7.1.0",
    "huggingface_hub>=0.36.0",
    "scipy>=1.16.3",
]
visual = [
    "omgifol>=0.5.1",
    "pillow>=11.3.0",
    "pypng>=0.20220715.0",
    "shapely>=2.1.2",
]
doomgen = ["doomgen"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["comrad*", "sample_factory*"]

[tool.uv.workspace]
members = [".", "DoomGen"]

[tool.uv.sources]
doomgen = { workspace = true }

[tool.ruff]
line-length = 120
extend-exclude = ["vizdoom.pyi", "make_doomgen_variants.py"]

[tool.ruff.lint]
ignore = [
        "E701",
        "F706",
    ]
