# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = lavapit.wad

# Rendering options
screen_resolution = RES_160X120
screen_format = CRCGCB
render_hud = true
render_crosshair = false
render_weapon = false
render_decals = false
render_particles = false
window_visible = false

# Finish the episode after 1000 game tics
episode_timeout = 1000

# Available buttons
available_buttons =
	{
		TURN_LEFT
		TURN_RIGHT
		MOVE_FORWARD
		MOVE_LEFT
		MOVE_RIGHT
	}

# Game variables that will be accessible in the state
# USER11: best jointly reached platform among active players
# USER12: furthest platform reached by any active player
# USER13: furthest currently supported bridge index
# USER14: success flag
# USER15: player 1 best platform reached this episode
# USER16: player 2 best platform reached this episode
# USER17: final platform index / success threshold for this generated map
# USER18: player 1 current platform (0 if not standing on a platform)
# USER19: player 2 current platform (0 if not standing on a platform)
# USER20: frontier entry plate currently occupied by any player
# USER21: current frontier bridge currently occupied by any player
# USER22: frontier exit plate currently occupied by any player
# USER23: current frontier bridge is up/supported (0/1)
available_game_variables = { DEAD USER11 USER12 USER13 USER14 USER15 USER16 USER17 USER18 USER19 USER20 USER21 USER22 USER23 }

mode = PLAYER
