# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = coop_puzzle.wad

# Rendering options
screen_resolution = RES_160X120
screen_format = CRCGCB
render_hud = true
render_crosshair = false
render_weapon = false
render_decals = false
render_particles = false
window_visible = false

# Finish the episode after 1200 game tics
episode_timeout = 2000

# Available buttons
available_buttons =
	{
		TURN_LEFT
		TURN_RIGHT
		MOVE_FORWARD
		MOVE_LEFT
		MOVE_RIGHT
	}

# Game variables that will be accessible in the state
# USER1: team max zone reached by either player
# USER2: whether any active plate / sync gate is currently engaged
# USER3: whether the current furthest zone is a sync room
# USER4: player 1 best zone reached this episode
# USER5: player 2 best zone reached this episode
# USER6: final zone index / success threshold for this generated map
# USER7-USER14 describe the frontier door pair: odd zone f = min(USER4, USER5) rounded up to odd (>= 1, <= USER6 - 1)
# and the even zone f + 1 behind its gates. Read-only telemetry; gameplay does not depend on them.
# USER7: frontier zone f
# USER8/USER9: centre x/y (map units) of the active plate in zone f (sync room: lane-A sync plate)
# USER10/USER11: centre x/y (map units) of the active plate in zone f + 1 (sync room: lane-B sync plate)
# USER12: lane of the zone-f plate (0 = A, 1 = B, 2 = sync room needing both players, -1 = none)
# USER13: sync timer of zone f in tics (0-104, 0 outside sync rooms)
# USER14: passable-gate bitmask (1 = frontier A gate, 2 = frontier B gate, 4 = next pair A gate, 8 = next pair B gate)
available_game_variables = { POSITION_X POSITION_Y USER1 USER2 USER3 USER4 USER5 USER6 DEAD USER7 USER8 USER9 USER10 USER11 USER12 USER13 USER14 }

mode = PLAYER
