# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = coop_puzzle.wad

# Rendering options
screen_resolution = RES_160X120
screen_format = CRCGCB
render_hud = true
render_crosshair = false
render_weapon = false
render_decals = false
render_particles = false
window_visible = false

# Finish the episode after 1200 game tics
episode_timeout = 2000

# Available buttons
available_buttons =
	{
		TURN_LEFT
		TURN_RIGHT
		MOVE_FORWARD
		MOVE_LEFT
		MOVE_RIGHT
	}

# Game variables that will be accessible in the state
# USER1: team max zone reached by either player
# USER2: whether any active plate / sync gate is currently engaged
# USER3: whether the current furthest zone is a sync room
# USER4: player 1 best zone reached this episode
# USER5: player 2 best zone reached this episode
# USER6: final zone index / success threshold for this generated map
available_game_variables = { POSITION_X POSITION_Y USER1 USER2 USER3 USER4 USER5 USER6 DEAD }

mode = PLAYER
