# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = rhythm_sync.wad

living_reward = 0

screen_resolution = RES_320X240
screen_format = CRCGCB
render_hud = true
render_crosshair = false
render_weapon = false
window_visible = false
render_screen_flashes = true

# 4200 tics comfortably covers the post-intro random rhythm mixture.
episode_timeout = 1750

available_buttons =
	{
		MOVE_FORWARD
		MOVE_BACKWARD
		MOVE_RIGHT
		MOVE_LEFT
		TURN_LEFT
		TURN_RIGHT
		USE
	}

# USER24: current_stage
# USER25: completed_stages
# USER26: current_stage_type (0=regular, 1=jittered, 2=single-observer)
# USER27: pending_a
# USER28: pending_b
# USER29: failed
# USER30: finished
# USER31: failure_reason
# USER32: num_sections
# USER33: switch_x_a
# USER34: switch_y_a
# USER35: switch_x_b
# USER36: switch_y_b
# USER37: cue_visible_a (1 if player A sees beat cue this tic, 0 otherwise)
# USER38: cue_visible_b (1 if player B sees beat cue this tic, 0 otherwise)
available_game_variables = { POSITION_X POSITION_Y USER24 USER25 USER26 USER27 USER28 USER29 USER30 USER31 USER32 USER33 USER34 USER35 USER36 USER37 USER38 }

mode = PLAYER
doom_skill = 3
