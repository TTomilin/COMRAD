name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  # While the repo's Pages source is "Deploy from a branch", GitHub's built-in Jekyll job
  # ("pages build and deployment") runs on every push to main and overwrites this site.
  # Re-deploy MkDocs right after it finishes so MkDocs is always the last deploy.
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Only the locked `docs` group: no torch/ViZDoom install, same mkdocs-material version as uv.lock.
      - name: Build site
        run: uv run --frozen --only-group docs mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
